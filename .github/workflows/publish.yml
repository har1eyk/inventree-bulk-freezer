name: Publish release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/inventree-bulk-freezer/
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist
      - name: Check release tag and generate checksums
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -c 'import os; from inventree_bulk_plugin import PLUGIN_VERSION; assert os.environ["RELEASE_TAG"] == "v" + PLUGIN_VERSION'
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
      - name: Attach validated packages to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.whl dist/*.tar.gz dist/SHA256SUMS --clobber
      - run: mv dist/SHA256SUMS SHA256SUMS
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          verify-metadata: true
