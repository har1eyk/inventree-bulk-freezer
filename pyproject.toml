#This file is used to package the InvenTreeBulk plugin.
#
#- It was generated by the InvenTree Plugin Creator tool - version 1.13.0
#- Ref: https://github.com/inventree/plugin_creator

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inventree-bulk-freezer"
description = "Freezer-box workflows extending InvenTree Bulk Plugin 1.5.2"
dynamic = ["version"]
authors = [
    { name = "wolflu05",email = "76838159+wolflu05@users.noreply.github.com" },
]
maintainers = [{ name = "Harley King" }]
readme = "README.md"
license = "MIT"
keywords = ["inventree", "plugin"]
requires-python = ">=3.9"
dependencies = [
    # Enter your plugin library dependencies here
    "pydantic==2.*",
    "Jinja2==3.*",
    "packaging>=23.2",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Framework :: InvenTree",
]
[project.urls]
Homepage = "https://github.com/har1eyk/inventree-bulk-freezer"
Repository = "https://github.com/har1eyk/inventree-bulk-freezer"
Issues = "https://github.com/har1eyk/inventree-bulk-freezer/issues"
Documentation = "https://github.com/har1eyk/inventree-bulk-freezer#readme"

[project.entry-points."inventree_plugins"]
InvenTreeBulkPlugin = "inventree_bulk_plugin.core:InvenTreeBulkPlugin"

[project.scripts]
inventree-freezer-batch = "inventree_bulk_plugin.batch:main"

[tool.setuptools.packages.find]
where = [""]
include = ["inventree_bulk_plugin*"]
exclude = ["inventree_bulk_plugin.frontend*", "inventree_bulk_plugin.static*"]

[tool.setuptools.dynamic]
version = {attr = "inventree_bulk_plugin.PLUGIN_VERSION"} 

[tool.ruff]
exclude = [
    ".git",
    "__pycache__",
    "test.py",
    "tests",
    "venv",
    "env",
    ".venv",
    ".env",
]

src=["inventree_bulk_plugin"]
