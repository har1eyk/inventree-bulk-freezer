services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: freezer_test
      POSTGRES_USER: freezer_test
      POSTGRES_PASSWORD: isolated-test-only
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U freezer_test']
      interval: 2s
      timeout: 5s
      retries: 30
  app:
    image: inventree/inventree:1.3.2
    entrypoint: [sh, -c, 'sleep infinity']
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:18437:8000'
    volumes:
      - '../:/release:ro'
    environment:
      INVENTREE_DB_ENGINE: postgresql
      INVENTREE_DB_HOST: db
      INVENTREE_DB_PORT: '5432'
      INVENTREE_DB_NAME: freezer_test
      INVENTREE_DB_USER: freezer_test
      INVENTREE_DB_PASSWORD: isolated-test-only
      INVENTREE_SITE_URL: http://127.0.0.1:18437
      INVENTREE_PLUGINS_ENABLED: 'True'
      INVENTREE_PLUGINS_MANDATORY: inventree-bulk-plugin
      INVENTREE_PLUGIN_TESTING: 'True'
      INVENTREE_PLUGIN_TESTING_SETUP: 'True'
